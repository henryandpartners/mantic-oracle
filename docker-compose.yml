services:
  neo4j:
    build:
      context: ./docker
      dockerfile: neo4j.Dockerfile
      args:
        N10S_VERSION: "5.26.0"   # must match the Neo4j base image minor
    image: mantic/neo4j-n10s:5.26
    container_name: mantic-neo4j
    environment:
      NEO4J_AUTH: neo4j/manticpass
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,n10s.*"
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_jvm_additional: "-DXX:+UnlockExperimentalVMOptions -XX:+UseG1GC"
    ports:
      - "7474:7474"   # HTTP / Cypher browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - ./ontology:/var/lib/neo4j/import   # ttl files reachable via file:/// URIs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p manticpass 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

volumes:
  neo4j_data:
